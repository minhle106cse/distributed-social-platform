# BLUEPRINT — not wired into any running app yet.
#
# apps/* have no Dockerfile in this repo yet (checked 2026-07-25) — there is
# no container whose logs this can actually tail. This config is the
# prepared collector for WHEN that lands: app containers keep writing plain
# JSON to stdout (unchanged — see createLogger's production transport,
# packages/shared-kernel/src/logger/index.ts, `pino/file` -> destination 1),
# Docker's default json-file log driver wraps each line, this tails that and
# ships to Elasticsearch. Zero app-code change needed to adopt this — it's a
# collector swap, not a logging-format swap.
#
# Routing (audit vs operational) needs NO special handling here: `dsp-logs`
# already has `index.default_pipeline: dsp-log-router` set at the index
# template level (docker-init/elasticsearch/index-template-dsp-logs.json) —
# verified live that ANY writer posting to `dsp-logs` without specifying a
# pipeline still gets context=AuditLog docs rerouted to dsp-audit-logs.

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   Off

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               dsp.*
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

# Docker's json-file driver wraps our JSON line inside {"log": "<our json>\n", ...}.
# This filter re-parses the `log` field so the app's own fields (serviceContext,
# context, trace_id, @timestamp, ...) land as top-level ES fields, not a blob.
[FILTER]
    Name          parser
    Match         dsp.*
    Key_Name      log
    Parser        app_json
    Reserve_Data  On

[OUTPUT]
    Name                 es
    Match                dsp.*
    Host                 elasticsearch
    Port                 9200
    HTTP_User            elastic
    HTTP_Passwd          ${ELASTIC_PASSWORD}
    Index                dsp-logs
    Suppress_Type_Name   On
    # Data streams require the create op_type (see pino-elasticsearch's
    # opType:'create' in logger/index.ts — same requirement, different client).
    Write_Operation      create
    tls                  Off
    Retry_Limit          False
