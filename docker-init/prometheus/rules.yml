groups:
  - name: cortex_event_pipeline
    interval: 15s
    rules:
      - record: notification:dlq_rate5m
        expr: rate(notification_dlq_total[5m])

      - record: notification:handler_retry_rate5m
        expr: rate(notification_handler_retry_total[5m])

      - record: notification:dedup_skipped_rate5m
        expr: rate(notification_dedup_skipped_total[5m])

      - record: search:dlq_rate5m
        expr: rate(search_dlq_total[5m])

      - record: search:handler_retry_rate5m
        expr: rate(search_handler_retry_total[5m])

      - record: search:chunks_indexed_rate5m
        expr: rate(search_chunks_indexed_total[5m])

      - record: outbox:dead_letter_rate5m
        expr: rate(core_api_outbox_dead_letter_total[5m])

      # core_api_outbox_backlog is a Gauge — queried raw in the dashboard/alert,
      # no recording rule needed (same treatment as circuit_breaker_state/
      # elasticsearch_clusterinfo_up above).

      - record: scheduled_job:failures_rate5m
        expr: rate(core_api_scheduled_job_failures_total[5m])

      # core_api_scheduled_job_last_success_timestamp_seconds is a Gauge — a
      # job that never fires at all (misconfigured @Cron, wiring bug) would
      # NOT show up in the failure-rate alert above (silence isn't a failure
      # tick), only in this timestamp going stale. Deliberately no staleness
      # alert yet — each job's expected interval differs by 3 orders of
      # magnitude (2s poll vs daily cron), a single threshold can't cover
      # both without per-job overrides; noted as a known gap, not solved here.

      - record: kafka:consumergroup_lag_by_group
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag)

      # circuit_breaker_state is a Gauge (0/1/2) — queried raw in the dashboard/alert,
      # no recording rule needed (same treatment as elasticsearch_clusterinfo_up).
      - record: circuit_breaker:transitions_rate5m
        expr: rate(circuit_breaker_transitions_total[5m])

  - name: cortex_infra
    interval: 15s
    rules:
      - record: postgres:app_connections
        expr: sum by (datname) (pg_stat_database_numbackends{datname=~"core_db|auth_db|notification_db|search_db"})
