apiVersion: 1

groups:
  - orgId: 1
    name: cortex_alerts
    folder: Cortex Alerts
    interval: 1m
    rules:
      - uid: cortex-service-down
        title: Service Down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "One of the Cortex app services stopped responding to /metrics"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job=~"core-api|auth-service|notification-service|search-service"}
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: cortex-notification-dlq
        title: Notification DLQ Rate Above Zero
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "notification-service is dead-lettering messages (see notification_dlq_total{reason})"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "notification:dlq_rate5m"
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cortex-scheduled-job-failures
        title: Scheduled Job Failure Rate Above Zero
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A core-api background job (@Cron/@Interval) is failing — see core_api_scheduled_job_failures_total{job} and GET /jobs for what's registered"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "scheduled_job:failures_rate5m"
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cortex-outbox-dead-letter
        title: Outbox Dead-Letter Rate Above Zero
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "core-api outbox rows are exhausting retries and becoming permanently FAILED_DLQ (see core_api_outbox_dead_letter_total{eventType}, core_api_outbox_backlog{status=\"FAILED_DLQ\"})"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "outbox:dead_letter_rate5m"
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cortex-search-dlq
        title: Search DLQ Rate Above Zero
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "search-service is dead-lettering messages — RAG indexing pipeline is dropping events"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "search:dlq_rate5m"
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cortex-kafka-lag-stuck
        title: Kafka Consumer Lag Stuck High
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is falling behind on topic {{ $labels.topic }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "kafka:consumergroup_lag_by_group"
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [50] }

      - uid: cortex-circuit-breaker-open
        title: Circuit Breaker Open
        condition: C
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN — the underlying dependency is failing and calls are being fast-failed"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: circuit_breaker_state
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: cortex-elasticsearch-unreachable
        title: Elasticsearch Unreachable
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "elasticsearch-exporter cannot reach the Elasticsearch cluster — search-service hybrid search will degrade"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: elasticsearch_clusterinfo_up
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
