syntax = "proto3";

package cortex.auth;

// Internal service-to-service contract, NOT public API. Called by core-api's
// SystemPermissionGuard to resolve a caller's SYSTEM-level permissions against
// auth_db, which is the only place System RBAC lives. Secured by shared-secret
// metadata (x-internal-secret), same convention as membership.proto /
// org-provisioning.proto.
//
// WHY THIS EXISTS (2026-08-25): core-api used to read the `permissions` claim
// straight out of the JWT. That made platform-admin authorization a snapshot
// taken at login: revoking SUPER_ADMIN left the old token fully privileged for
// the remainder of its 15-minute life, and there was no way to shorten that
// without shortening every token. Org RBAC never had this problem because
// OrgGuard resolves from the DB per request — this contract closes the same gap
// for the system tier. `.ai/memory/gotchas.jsonl` already recorded the root
// cause: "any implicit-all / role-shortcut design that lives only in a
// JWT-claim-checking guard MUST be expanded at token-mint time, not assumed".
//
// The response is the FULLY RESOLVED permission list, not the role names:
// SUPER_ADMIN's implicit-all expansion happens here, on the side that owns the
// rule, so core-api never re-derives it and the two cannot drift.
service SystemRbac {
  rpc ResolveSystemPermissions(ResolveSystemPermissionsRequest)
      returns (ResolveSystemPermissionsResponse);
}

message ResolveSystemPermissionsRequest {
  string user_id = 1;
}

message ResolveSystemPermissionsResponse {
  // Empty for an unknown, deleted, or inactive user, and for a real user who
  // simply holds no system role — all four are "no platform privileges", which
  // is the same authorization answer, so they are deliberately NOT
  // distinguished on the wire.
  repeated string permissions = 1;
}
