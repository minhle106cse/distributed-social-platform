syntax = "proto3";

package cortex.tenant;

// Internal service-to-service contract, NOT public API. Called by services
// that hold no Membership table of their own (e.g. search-service) to verify
// a caller-supplied X-Org-Id actually corresponds to real org membership
// before trusting it — mirrors core-api's OrgGuard check, just over the wire.
// Secured by shared-secret metadata (x-internal-secret), same convention as
// org-provisioning.proto.
service MembershipVerification {
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
}

message CheckMembershipRequest {
  string org_id = 1;
  string user_id = 2;
}

message CheckMembershipResponse {
  bool is_member = 1;
  // Resolved org permissions for this (org_id, user_id) — empty if not a
  // member. Same resolution rule as core-api's OrgGuard (OWNER implicit-all,
  // other roles read from org_role_permissions), computed server-side so
  // callers never need to know role names, only permission codes.
  repeated string permissions = 2;
  // The caller's role in this org — empty if not a member. Added 2026-08-25
  // purely so the CLIENT can cache the two facts SEPARATELY: membership
  // (org_id, user_id) and the permission set (org_id, role) change at very
  // different rates and are invalidated by different writes. Callers still
  // MUST authorize on `permissions`, never by comparing this role name —
  // that is the hardcoded-role-check the whole dynamic Org RBAC exists to
  // avoid.
  string role = 3;
}
